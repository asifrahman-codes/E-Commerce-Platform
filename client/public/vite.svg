<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient-shop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Sphere/Orbit -->
  <circle cx="50" cy="50" r="48" stroke="url(#gradient-shop)" stroke-width="4" fill="none" opacity="0.3" />
  <ellipse cx="50" cy="50" rx="48" ry="20" stroke="url(#gradient-shop)" stroke-width="3" fill="none" transform="rotate(-30 50 50)" opacity="0.5" />
  <ellipse cx="50" cy="50" rx="48" ry="20" stroke="url(#gradient-shop)" stroke-width="3" fill="none" transform="rotate(30 50 50)" opacity="0.5" />

  <!-- Inner Shopping Bag with Sphere detail -->
  <path d="M35 30 H65 L70 85 H30 Z" fill="url(#gradient-shop)" />
  <path d="M40 30 V22 A10 10 0 0 1 60 22 V30" stroke="#ffffff" stroke-width="4" fill="none" />
  
  <!-- Small Inner Sphere highlight -->
  <circle cx="50" cy="58" r="10" fill="#ffffff" opacity="0.9" />
  <circle cx="50" cy="58" r="5" fill="url(#gradient-shop)" />
</svg>